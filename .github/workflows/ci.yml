name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (project + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]"

      - name: Ruff (lint + format check)
        run: ruff check .

      - name: Mypy (strict, core + ui)
        run: mypy core/ ui/ gui.py cli.py

      - name: Pytest
        run: pytest
